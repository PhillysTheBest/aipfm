version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file: ./aipfm-backend/.env
    environment:
      - POSTGRES_DB=${DB_NAME:-aipfm}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./aipfm-backend
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./aipfm-backend:/app
    ports:
      - "8000:8000"
    env_file: ./aipfm-backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,api,frontend
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      - db
      - redis

  worker:
    build: ./aipfm-backend
    command: celery -A backend worker -l info
    volumes:
      - ./aipfm-backend:/app
    env_file: ./aipfm-backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build: ./aipfm-frontend/frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
